name: Predictive Maintenance CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: predictive-maintenance-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements-ci.txt

      - name: Run automated tests
        run: pytest -v

  deploy:
    name: Deploy to AWS EC2
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$EC2_HOST" || (echo "EC2_HOST secret is missing" && exit 1)
          test -n "$EC2_USER" || (echo "EC2_USER secret is missing" && exit 1)
          test -n "$EC2_SSH_KEY" || (echo "EC2_SSH_KEY secret is missing" && exit 1)

      - name: Deploy over SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_deploy_key
          chmod 600 ~/.ssh/ec2_deploy_key

          ssh -i ~/.ssh/ec2_deploy_key \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            "$EC2_USER@$EC2_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail

          APP_DIR="$HOME/predictive-maintenance-mlops"
          REPO_URL="https://github.com/meAnkit18/predictive-maintenance-mlops.git"

          # Ensure tools exist on the instance.
          command -v git >/dev/null || { echo "git is not installed on EC2"; exit 1; }
          command -v docker >/dev/null || { echo "Docker is not installed on EC2"; exit 1; }
          sudo docker info >/dev/null

          if [ ! -d "$APP_DIR/.git" ]; then
            git clone "$REPO_URL" "$APP_DIR"
          fi

          cd "$APP_DIR"
          git fetch origin main
          git reset --hard origin/main

          # Build the inference-only image, avoiding MLflow/XGBoost training packages.
          sudo docker build --pull -t predictive-maintenance-api:latest .

          # Start new container, then confirm health before stopping the prior one.
          sudo docker rm -f predictive-maintenance-next 2>/dev/null || true
          sudo docker run -d \
            --name predictive-maintenance-next \
            -p 8001:8000 \
            predictive-maintenance-api:latest

          healthy=0
          for attempt in $(seq 1 30); do
            if sudo docker exec predictive-maintenance-next python -c "from urllib.request import urlopen; r=urlopen('http://127.0.0.1:8000/health', timeout=3); assert r.status == 200"; then
              healthy=1
              break
            fi
            sleep 3
          done

          if [ "$healthy" -ne 1 ]; then
            echo "New container did not pass health check. Logs:"
            sudo docker logs --tail 100 predictive-maintenance-next
            sudo docker rm -f predictive-maintenance-next
            exit 1
          fi

          sudo docker rm -f predictive-maintenance 2>/dev/null || true
          sudo docker stop predictive-maintenance-next >/dev/null
          sudo docker rm predictive-maintenance-next
          sudo docker run -d \
            --name predictive-maintenance \
            --restart unless-stopped \
            -p 8000:8000 \
            predictive-maintenance-api:latest

          # Allow the public API to serve the Vercel dashboard over HTTPS.
          # The EC2 security group must also allow inbound TCP 8000.
          for attempt in $(seq 1 20); do
            if sudo docker exec predictive-maintenance python -c "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"; then
              echo "Deployment successful: API health check passed."
              exit 0
            fi
            sleep 3
          done

          echo "Final container health check failed. Logs:"
          sudo docker logs --tail 100 predictive-maintenance
          exit 1
          REMOTE
